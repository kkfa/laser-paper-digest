name: Laser paper digest
on:
  workflow_dispatch:
  schedule:
    # 09:30 Asia/Shanghai (01:30 UTC). GitHub schedules may run late.
    - cron: '30 1 * * *'
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAPER_FIREHOSE_DATA_DIR: ${{ github.workspace }}/.paper_firehose
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache/restore@v4
        with:
          path: |
            .paper_firehose/all_feed_entries.db
            .paper_firehose/matched_entries_history.db
            .paper_firehose/papers.db
          key: paper-db-${{ github.run_id }}
          restore-keys: paper-db-
      - name: Install
        run: python -m pip install -e .
      - name: Prepare configuration
        shell: bash
        run: |
          mkdir -p "$PAPER_FIREHOSE_DATA_DIR/config"
          cp -R github_actions_config/. "$PAPER_FIREHOSE_DATA_DIR/config/"
          python scripts/prepare_email_config.py
      - name: Fetch and rank papers
        shell: bash
        run: |
          paper-firehose --config "$PAPER_FIREHOSE_DATA_DIR/config/config.yaml" filter
          paper-firehose --config "$PAPER_FIREHOSE_DATA_DIR/config/config.yaml" rank
          paper-firehose --config "$PAPER_FIREHOSE_DATA_DIR/config/config.yaml" abstracts --mailto "$SENDER_EMAIL" --rps 1.0
      - name: Send digest
        run: paper-firehose --config "$PAPER_FIREHOSE_DATA_DIR/config/config.yaml" email
      - name: Save database for deduplication
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            .paper_firehose/all_feed_entries.db
            .paper_firehose/matched_entries_history.db
            .paper_firehose/papers.db
          key: paper-db-${{ github.run_id }}
