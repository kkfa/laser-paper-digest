name: Keep scheduled digest active
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
permissions:
  contents: write
jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update activity timestamp
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/last-activity.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/last-activity.txt
          git commit -m 'chore: keep scheduled workflows active [skip ci]'
          git push
